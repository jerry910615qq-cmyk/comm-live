<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>溝通報告｜現場遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a single phone column; status card on top, the current question below. */
:root {
  --bg: #EFF2F4; --card: #FDFCFA; --ink: #3B4350; --muted: #626A77; --line: #D6DCE2;
  --accent: #4F7189; --accent-soft: #DCE7EF; --warm: #9C5D3B; --warm-soft: #F5E1D3;
  --ok: #3D6B4A; --ok-soft: #E6F1E8; --no: #8A4A40; --no-soft: #F8E6E2; --on-accent: #FBF8F3;
  --font: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; --num: 'Space Grotesk', 'Noto Sans TC', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1D2329; --card: #283039; --ink: #E6EAEE; --muted: #AEB7C1; --line: #3B4652; --accent: #9DBBD0; --accent-soft: #2F3E4B; --warm: #E3B497; --warm-soft: #44352C; --ok: #9CCBA8; --ok-soft: #233A2B; --no: #E7A79C; --no-soft: #432A27; --on-accent: #1D2329; color-scheme: dark; }
}
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 24px; margin: 0; line-height: 1.3; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: #B9B4AC; display: inline-block; }
.pill.on i { background: #4C9A63; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.big { font-family: var(--num); font-size: 56px; font-weight: 700; line-height: 1; color: var(--accent); margin: 0; }
.muted { color: var(--muted); margin: 0; }
label { font-weight: 700; }
input { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.btn { font: 700 18px var(--font); border-radius: 14px; padding: 14px 18px; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.q { font-size: 20px; font-weight: 700; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; cursor: pointer; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.no { border-color: var(--no); background: var(--no-soft); }
.opt[disabled] { cursor: default; }
.res { font-size: 19px; font-weight: 700; margin: 0; padding: 10px 14px; border-radius: 12px; }
.res.ok { color: var(--ok); background: var(--ok-soft); }
.res.no { color: var(--no); background: var(--no-soft); }
.code { font-family: var(--num); font-size: 44px; font-weight: 700; letter-spacing: 8px; color: var(--accent); margin: 0; }
.btn:focus-visible, .opt:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.kind { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
.res.lock { color: var(--accent); background: var(--accent-soft); }
.center { text-align: center; }
.idle { align-items: center; padding: 26px 18px; }
.teach { width: 220px; height: auto; display: block; margin: 0 auto; --board: #4F7189; --chalk: #FBF8F3; }
.teach .stick { transform-origin: 58px 92px; animation: point 1.8s ease-in-out infinite; }
@keyframes point { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
.score { display: flex; align-items: baseline; gap: 12px; }
.meter { height: 12px; border-radius: 6px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
@media (prefers-reduced-motion: reduce) { .teach .stick { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="pill" id="conn"><i></i><span id="connTxt">連線中…</span></span><span id="who"></span></div>
<div id="app"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function () {
  var BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
  var P = 'comm8live/v1/';
  var SCORE = { elev1: { A: 18, B: 34, C: 10 }, elev2: { A: 33, B: 20, C: 8 }, elev3: { A: 22, B: 8, C: 33 } };
  var ELEV = ['elev1', 'elev2', 'elev3'];
  var TEACHER = '<svg class="teach" viewBox="0 0 240 170" aria-hidden="true">' +
    '<rect x="70" y="14" width="156" height="104" rx="10" fill="#4F7189"/>' +
    '<path d="M92 44 H190 M92 64 H170 M92 84 H200" stroke="#FBF8F3" stroke-width="7" stroke-linecap="round"/>' +
    '<rect x="132" y="118" width="10" height="34" fill="#4F7189"/>' +
    '<g class="stick"><path d="M58 92 L104 52" stroke="#9C5D3B" stroke-width="6" stroke-linecap="round"/></g>' +
    '<path d="M14 166 C14 124 28 104 46 104 C64 104 78 124 78 166 Z" fill="#8FAEC3"/>' +
    '<circle cx="46" cy="78" r="24" fill="#F2D4C2"/>' +
    '<path d="M22 76 C22 54 34 46 46 46 C60 46 72 56 70 76 C64 64 54 60 44 62 C34 62 26 68 22 76 Z" fill="#4A5869"/>' +
    '<circle cx="38" cy="80" r="3.5" fill="#3B4350"/><circle cx="54" cy="80" r="3.5" fill="#3B4350"/>' +
    '<path d="M38 92 Q46 98 54 92" fill="none" stroke="#3B4350" stroke-width="3" stroke-linecap="round"/>' +
    '</svg>';
  var qs = new URLSearchParams(location.search);
  var room = (qs.get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var bi = Math.max(0, Math.min(BROKERS.length - 1, parseInt(qs.get('b') || '0', 10) || 0));
  var app = document.getElementById('app');
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var pid = lsGet('comm8pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12); lsSet('comm8pid', pid); }
  var me = lsGet('comm8me_' + room) || {};
  me.name = me.name || ''; me.joined = !!me.joined; me.votes = me.votes || {}; me.results = me.results || {}; me.endSeen = !!me.endSeen;
  function save() { lsSet('comm8me_' + room, me); }
  var st = null, connected = false, client = null, tries = 0;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function setConn() {
    document.getElementById('conn').className = 'pill' + (connected ? ' on' : '');
    document.getElementById('connTxt').textContent = connected ? '已連線｜房間 ' + room : '連線中…';
    document.getElementById('who').textContent = me.joined ? me.name : '';
  }
  function connect() {
    client = mqtt.connect(BROKERS[bi], { clientId: 'p_' + pid + '_' + Math.random().toString(16).slice(2, 6), clean: true, reconnectPeriod: 2000, connectTimeout: 8000, keepalive: 30 });
    client.on('connect', function () { connected = true; tries = 0; client.subscribe(P + room + '/state', { qos: 1 }); if (me.joined) join(); setConn(); draw(); });
    client.on('close', function () { connected = false; tries++; setConn(); draw(); });
    client.on('message', function (t, m) {
      var s = m.toString(); if (!s) { st = { phase: 'gone' }; draw(); return; }
      try { st = JSON.parse(s); } catch (e) { return; }
      var q = st.q;
      if (q && q.status === 'closed' && q.correct && me.votes[q.id] && !(q.id in me.results)) { me.results[q.id] = me.votes[q.id] === q.correct; save(); }
      if (st.slide === 'elevend' && !me.endSeen) { me.endSeen = true; save(); }
      draw();
    });
  }
  function join() { client.publish(P + room + '/join', JSON.stringify({ pid: pid, name: me.name }), { qos: 1 }); }
  function vote(qid, c) { me.votes[qid] = c; save(); client.publish(P + room + '/vote', JSON.stringify({ pid: pid, name: me.name, qid: qid, c: c }), { qos: 1 }); draw(); }

  function card(inner, cls) { return '<div class="card' + (cls ? ' ' + cls : '') + '">' + inner + '</div>'; }
  function draw() {
    if (!room) { app.innerHTML = card('<h1>請掃大螢幕上的 QR code</h1><p class="muted">這個網址少了房間代碼。</p>'); return; }
    if (!connected) { app.innerHTML = card('<h1>連線中…</h1><p class="muted">' + (tries > 2 ? '連不上的話，請關掉 Wi-Fi 改用行動網路，再重新整理這一頁。' : '請稍等幾秒。') + '</p>'); return; }
    if (!me.joined) {
      app.innerHTML = card('<h1>加入現場遊戲</h1><label for="nm">你的名字或暱稱</label><input id="nm" maxlength="20" autocomplete="nickname" placeholder="例如：小明"><button class="btn" id="go" type="button">加入</button>');
      var nm = document.getElementById('nm'); nm.value = me.name || '';
      document.getElementById('go').addEventListener('click', function () { me.name = nm.value.trim().slice(0, 20) || '匿名玩家'; me.joined = true; save(); join(); setConn(); draw(); });
      return;
    }
    if (!st) { app.innerHTML = card('<h1>已加入</h1><p class="muted">等報告人的簡報連上線……</p>'); return; }
    if (st.phase === 'gone') { app.innerHTML = card('<h1>這個房間已經關閉</h1><p class="muted">請重新掃大螢幕上的 QR code。</p>'); return; }
    if (st.phase === 'lobby') { app.innerHTML = card('<h1>你已加入！</h1><p class="big">' + (st.count || 0) + '</p><p class="muted">人已加入。等報告人按「開始遊戲」。</p>'); return; }
    var q = st.q;
    if (!q) { app.innerHTML = card(TEACHER + '<h1 class="center">請認真聆聽講者演講</h1><p class="muted center">有題目的時候，這裡會自動跳出選項。</p>', 'idle') + elevSummary() + scoreCard(); return; }
    var mine = me.votes[q.id], isElev = q.kind === 'elev';
    var h = '<p class="kind">' + (isElev ? '電梯簡報' : q.kind === 'media' ? '管道排名' : '上司還是下屬？') + '</p><p class="q">' + esc(q.prompt) + '</p><div class="opts">';
    q.options.forEach(function (o) {
      var cls = 'opt';
      if (q.status === 'closed' && !isElev) { if (o.k === q.correct) cls += ' ok'; else if (o.k === mine) cls += ' no'; }
      else if (o.k === mine) cls += ' sel';
      h += '<button type="button" class="' + cls + '" data-k="' + esc(o.k) + '"' + (q.status === 'closed' ? ' disabled' : '') + '>' + esc(o.l) + '</button>';
    });
    h += '</div>';
    if (q.status === 'open') h += '<p class="muted">' + (mine ? '已送出，截止前可以改選。' : '點一個選項作答。') + '</p>';
    else if (isElev) h += '<p class="res lock">' + (mine ? '已鎖定你的回答：' + esc(mine) + '。說服率到 50 樓一起揭曉！' : '這一關你沒有作答。') + '</p>';
    else if (!mine) h += '<p class="res no">這題你沒有作答</p>';
    else h += mine === q.correct ? '<p class="res ok">✓ 答對了！</p>' : '<p class="res no">哦，這題你可能錯誤囉～</p>';
    app.innerHTML = card(h) + (q.status === 'closed' ? elevSummary() : '') + scoreCard();
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (b) { b.addEventListener('click', function () { vote(q.id, b.getAttribute('data-k')); }); });
  }
  function scoreCard() {
    var ids = Object.keys(me.results); if (!ids.length) return '';
    var ok = ids.filter(function (id) { return me.results[id]; }).length, pct = Math.round(ok / ids.length * 100);
    return card('<p class="muted">你的答題成績</p><div class="score"><p class="big">' + pct + '%</p><p class="muted">答對 ' + ok + ' / ' + ids.length + ' 題</p></div><div class="meter"><i style="width:' + pct + '%"></i></div>');
  }
  function elevSummary() {
    if (!me.endSeen) return '';
    var path = ELEV.map(function (id) { return me.votes[id] || ''; });
    if (path.some(function (x) { return !x; })) return card('<p class="muted">電梯簡報</p><p>你有關卡沒作答，這次沒有說服率。</p>');
    var r = 0; path.forEach(function (k, i) { r += SCORE[ELEV[i]][k] || 0; });
    var say = r >= 90 ? '「好，下週就開始試辦。」' : r >= 65 ? '「有點意思，把數字整理好再來找我。」' : '「我再想想。」電梯門開了……';
    return card('<p class="muted">你的電梯簡報路線</p><p class="code">' + esc(path.join(' → ')) + '</p><div class="score"><p class="big">' + r + '%</p><p class="muted">說服主管的機率</p></div><div class="meter"><i style="width:' + r + '%"></i></div><p class="res ' + (r >= 90 ? 'ok' : 'lock') + '">主管：' + say + '</p><p class="muted">參考路線 B → A → C 是 100%。</p>');
  }
  setConn(); draw();
  if (room) { if (typeof mqtt === 'undefined') app.innerHTML = card('<h1>載入失敗</h1><p class="muted">請重新整理這一頁。</p>'); else connect(); }
})();
</script>
</body>
</html>
